<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102139"><title>الخرائط الموضوعية | درس تفاعلي</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="heading"><strong>الخرائط الموضوعية</strong><small>الصف العاشر · الأستاذ محمد الشرمان</small></div><div class="topActions"><button id="full" title="ملء الشاشة" aria-label="ملء الشاشة">⛶ <span>ملء الشاشة</span></button><button id="help" title="تعليمات الاستخدام" aria-label="تعليمات الاستخدام">؟</button></div></header>
<main><div class="viewer-wrap"><div id="viewport" aria-label="منطقة عرض الشريحة"><div id="canvas"><img id="slide" src="slides/page-01.jpg" alt="الشريحة الأولى" draggable="false"><div id="hotspots"></div><div id="inlineMedia" class="inline-media" hidden><video id="slideVideo" controls playsinline preload="metadata" poster="" aria-label="الفيديو التعليمي المدمج" src="media/video.mp4"></video><div class="media-toolbar"><span>الفيديو التعليمي المدمج</span><button type="button" id="inlineVideoFull" aria-label="ملء شاشة الفيديو">⛶ ملء شاشة الفيديو</button></div></div></div></div></div>
<section class="controls" aria-label="أدوات العرض"><div class="navigation"><button id="prev" class="nav-button"><span class="arrow" aria-hidden="true">›</span><span>السابق</span></button><div class="jump"><label for="jump">الانتقال إلى</label><select id="jump"></select><span id="counter">1 / 21</span></div><button id="next" class="primary nav-button"><span>التالي</span><span class="arrow" aria-hidden="true">‹</span></button></div><div class="secondaryControls"><button id="zoomIn" title="تكبير">＋ <span>تكبير</span></button><span id="zoomLabel">100%</span><button id="zoomOut" title="تصغير">－ <span>تصغير</span></button><button id="resetZoom">إعادة الضبط</button><button id="resourcesToggle" class="resourcesButton" aria-expanded="false">◈ <span>روابط وأنشطة الشريحة</span> <span id="resourceCount"></span></button></div></section>
<aside id="resources" hidden aria-label="موارد الشريحة"><div class="asideTitle"><strong>موارد الشريحة <span id="resourceSlide">1</span></strong><button id="closeResources">✕ إغلاق</button></div><div id="resourcesList"></div></aside>
</main>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modalCard"><div class="modalHeader"><strong id="modalTitle">الفيديو</strong><div><button id="videoFull">⛶ ملء شاشة الفيديو</button><button id="modalClose">✕ إغلاق</button></div></div><div id="modalContent"></div></section></div>
<button id="revealTools" type="button" hidden aria-label="إظهار أدوات العرض">☰</button><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
